<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Hosted Video Background</title>
    <style>
        /* Reset margins and hide scrollbars */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            background-color: #000;
        }

        /* Background video container */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        /* Force native HTML5 video to cover the screen perfectly without distortion */
        .video-background video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        /* Matte overlay to preserve high typography contrast and design focus */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45); 
            z-index: 0;
        }

        /* Content layer positioning */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        p {
            font-size: 1.25rem;
            max-width: 600px;
            line-height: 1.6;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- Native HTML5 Video Layer -->
    <div class="video-background">
        <!-- Direct stream configuration from GitHub with autoplay, looping, and silent layout parameters -->
        <video autoplay loop muted playsinline>
            <!-- 
               CHOOSE ONE URL FORMAT BELOW AND REPLACE THE PLACEHOLDER SOURCE PATH:
               
               Option A (If using a raw repository link):
               https://githubusercontent.com
               
               Option B (If using GitHub Pages deployment):
               https://YOUR_GITHUB_USERNAME.github.io/YOUR_REPO_NAME/wwwbag.mp4
            -->
            <source src="https://githubusercontent.com" type="video/mp4">
            Your browser does not support HTML5 video layout systems.
        </video>
    </div>
    
    <!-- Design Overlay Mask -->
    <div class="video-overlay"></div>

    <!-- Foreground Interface Content -->
    <div class="content">
        <h1>Design Concept</h1>
        <p>This layout streams your file seamlessly from GitHub's infrastructure, bypassing cross-origin frame limitations entirely.</p>
    </div>

</body>
</html>
