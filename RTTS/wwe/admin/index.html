<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTTS Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Add Store Form -->
        <div class="bg-white rounded-lg shadow-md p-6 h-fit">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">Add Medical Store</h2>
            <form id="addStoreForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Tab / Region</label>
                    <input type="text" id="tabName" placeholder="e.g., local, raipur NH" class="mt-1 block w-full p-2 border rounded-md" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Route / City</label>
                    <input type="text" id="routeName" placeholder="e.g., SADER ROAD" class="mt-1 block w-full p-2 border rounded-md" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Medical Store Name</label>
                    <input type="text" id="storeName" placeholder="e.g., DEEPAK MEDICAL" class="mt-1 block w-full p-2 border rounded-md" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Mobile Number</label>
                    <input type="text" id="mobileNum" class="mt-1 block w-full p-2 border rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">WhatsApp Link</label>
                    <input type="url" id="whatsappLink" class="mt-1 block w-full p-2 border rounded-md">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition">
                    Add Store to Database
                </button>
            </form>
            <div id="statusMessage" class="mt-4 text-center font-medium hidden"></div>
        </div>

        <!-- Store Management Table -->
        <div class="lg:col-span-2 bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">Manage Existing Stores</h2>
            <div class="overflow-x-auto h-[600px] overflow-y-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 bg-gray-100 shadow-sm">
                        <tr class="text-gray-600 text-sm">
                            <th class="p-3 border-b">Tab</th>
                            <th class="p-3 border-b">Route</th>
                            <th class="p-3 border-b">Medical Store</th>
                            <th class="p-3 border-b text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="storeList" class="text-sm">
                        <tr><td colspan="4" class="p-4 text-center">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://h-wwe-295d0-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Add Store Logic
        document.getElementById('addStoreForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const tab = document.getElementById('tabName').value.trim();
            const route = document.getElementById('routeName').value.trim();
            const storeName = document.getElementById('storeName').value.trim();
            const statusMsg = document.getElementById('statusMessage');

            try {
                const storeRef = push(ref(database, `tabs/${tab}/${route}`));
                await set(storeRef, {
                    medicalName: storeName,
                    status: "", remark: "", chalan: 0,
                    mobile: document.getElementById('mobileNum').value,
                    whatsapp: document.getElementById('whatsappLink').value,
                    searchTags: storeName.toLowerCase()
                });
                document.getElementById('storeName').value = ''; 
                statusMsg.textContent = `${storeName} added!`;
                statusMsg.className = "mt-4 text-center font-medium text-green-600 block";
                setTimeout(() => statusMsg.classList.add('hidden'), 3000);
            } catch (error) {
                statusMsg.textContent = "Error: " + error.message;
                statusMsg.className = "mt-4 text-center font-medium text-red-600 block";
            }
        });

        // Load & Delete Store Logic
        onValue(ref(database, 'tabs'), (snapshot) => {
            const data = snapshot.val() || {};
            const tbody = document.getElementById('storeList');
            tbody.innerHTML = '';
            
            for (const [tabKey, tabData] of Object.entries(data)) {
                for (const [routeKey, routeData] of Object.entries(tabData)) {
                    for (const [storeId, storeInfo] of Object.entries(routeData)) {
                        const tr = document.createElement('tr');
                        tr.className = "border-b hover:bg-gray-50";
                        tr.innerHTML = `
                            <td class="p-3 font-medium text-gray-700">${tabKey}</td>
                            <td class="p-3 text-gray-600">${routeKey}</td>
                            <td class="p-3 font-bold text-gray-900">${storeInfo.medicalName}</td>
                            <td class="p-3 text-center">
                                <button class="delete-btn bg-red-100 text-red-600 hover:bg-red-500 hover:text-white px-3 py-1 rounded transition text-xs font-bold" 
                                        data-path="tabs/${tabKey}/${routeKey}/${storeId}" 
                                        data-name="${storeInfo.medicalName}">Delete</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    }
                }
            }

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const path = e.target.getAttribute('data-path');
                    const name = e.target.getAttribute('data-name');
                    if(confirm(`Are you sure you want to delete ${name}?`)) {
                        await remove(ref(database, path));
                    }
                });
            });
        });
    </script>
</body>
</html>
