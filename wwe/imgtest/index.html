<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Bank Logo Dashboard</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .logo-wrapper {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .logo-wrapper img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }
        .bank-name {
            font-weight: 600;
            font-size: 1.1rem;
        }
        .bank-domain {
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Tokenless Indian Bank Logo Demo</h1>
        <p>A fast frontend dashboard showing live Indian bank icons loaded directly by domain variants.</p>
    </header>

    <div class="grid">
        <!-- State Bank of India -->
        <div class="card">
            <div class="logo-wrapper">
                <img src="https://clearbit.com" alt="SBI Logo" loading="lazy">
            </div>
            <div class="bank-name">State Bank of India</div>
            <div class="bank-domain">sbi.co.in</div>
        </div>

        <!-- HDFC Bank -->
        <div class="card">
            <div class="logo-wrapper">
                <img src="https://clearbit.com" alt="HDFC Logo" loading="lazy">
            </div>
            <div class="bank-name">HDFC Bank</div>
            <div class="bank-domain">hdfcbank.com</div>
        </div>

        <!-- ICICI Bank -->
        <div class="card">
            <div class="logo-wrapper">
                <img src="https://clearbit.com" alt="ICICI Logo" loading="lazy">
            </div>
            <div class="bank-name">ICICI Bank</div>
            <div class="bank-domain">icicibank.com</div>
        </div>

        <!-- Axis Bank -->
        <div class="card">
            <div class="logo-wrapper">
                <img src="https://clearbit.com" alt="Axis Logo" loading="lazy">
            </div>
            <div class="bank-name">Axis Bank</div>
            <div class="bank-domain">axisbank.com</div>
        </div>
    </div>
</div>

</body>
</html>
